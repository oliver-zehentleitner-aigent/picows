  --fg: #dcdce3; --fg2: #a2a2ad; --fg3: #6f6f7a;
  --accent: #835bec; --accent2: #a98cf5;
  --ok: #4fbf7a; --warn: #e0a83a; --bad: #e0574f; --info: #4aa3df; --muted: #8b8b98;
  --confirmed: #4fbf7a; --inferred: #e0a83a; --unknown: #e0574f;
  --active: #835bec; --superseded: #6f6f7a; --open: #4aa3df; --needs-review: #e0a83a; --pending-confirmation: #d66fd6;
  --radius: 8px; --font: -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #fafafa; --bg2: #ffffff; --bg3: #f0f0f3; --line: #e2e2e8;
  --fg: #1f1f26; --fg2: #55555f; --fg3: #8a8a96; --superseded: #9a9aa6;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.5 var(--font); background: var(--bg); color: var(--fg); }
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--bg3); padding: 1px 5px; border-radius: 4px; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

.app { display: grid; height: 100vh; grid-template-columns: 280px 1fr 340px; grid-template-rows: 48px 36px 1fr 24px;
  grid-template-areas: "top top top" "strip strip strip" "side main details" "status status status"; }
.strip { grid-area: strip; display: flex; align-items: center; gap: 6px; padding: 0 14px; background: var(--bg2); border-bottom: 1px solid var(--line); overflow-x: auto; white-space: nowrap; font-size: 12px; }
.strip .sep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; flex: none; }
.strip .lbl { color: var(--fg2); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-right: 2px; }
.strip a.stat { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg); background: var(--bg); }
.strip a.stat b { color: var(--fg); font-weight: 650; }
.strip a.stat:hover { text-decoration: none; border-color: var(--fg3); }
.strip a.stat.zero { color: var(--fg2); } .strip a.stat.zero b { color: var(--fg2); font-weight: 500; }
.strip a.stat.q-open b { color: var(--open); } .strip a.stat.q-needs-review b { color: var(--needs-review); } .strip a.stat.q-pending-confirmation b { color: var(--pending-confirmation); } .strip a.stat.q-unknown b { color: var(--unknown); }
.strip a.stat.lint-bad b { color: var(--bad); } .strip a.stat.lint-warn b { color: var(--warn); } .strip a.stat.lint-ok b { color: var(--ok); }
.strip a.stat.hot { border-color: color-mix(in srgb, var(--warn) 60%, transparent); }
/* The top bar stays dark in both themes, like the site's header: the wordmark is made for a dark ground. */
.topbar { grid-area: top; display: flex; align-items: center; gap: 16px; padding: 0 14px; background: #141418; border-bottom: 1px solid #2a2a31; color: #e6e6ec; color-scheme: dark; }
.topbar .project { color: #b4b4be; } .topbar .project b { color: #ffffff; }
.topbar .pill { background: #23232a; color: #c4c4cc; border-color: #3a3a43; font-size: 12px; line-height: 20px; }
.topbar .pill a, .topbar a.gh { color: #c9b8ff; }
.topbar #search, .topbar .project-select { background: #1e1e24; color: #e6e6ec; border-color: #3a3a43; }
.topbar #search::placeholder { color: #7a7a86; }
.topbar .icon-btn { color: #c4c4cc; border-color: #3a3a43; } .topbar .icon-btn:hover { color: #fff; border-color: #6f6f7a; }
.topbar .live { color: #6f6f7a; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--fg); letter-spacing: .2px; }
.brand:hover { text-decoration: none; }
.brand img { display: block; }
.brand .wordmark { height: 29px; width: auto; }
.gh { color: var(--fg2); }
.queue-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 8px 0 8px; }
.queue-tiles a.tile { color: var(--fg); }
.queue-tiles a.tile:hover { border-color: var(--accent); text-decoration: none; }
.project-select { max-width: 60vw; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 14px; }
.project-select:focus { border-color: var(--accent); outline: none; }
.project { color: var(--fg2); font-size: 15px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }
.project b { color: var(--fg); font-weight: 600; }
.project .pill { margin-left: 8px; }
.topbar-right { display: flex; align-items: center; gap: 10px; position: relative; }
#search { width: 300px; padding: 6px 10px; font-size: 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); outline: none; }
#search:focus { border-color: var(--accent); }
.search-results { position: absolute; top: 40px; right: 70px; width: 480px; max-height: 60vh; overflow: auto; background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,.35); z-index: 20; }
.search-results a { display: block; padding: 8px 12px; color: var(--fg); border-bottom: 1px solid var(--line); }
.search-results a:hover, .search-results a.sel { background: var(--bg3); text-decoration: none; }
.search-results .sr-file { color: var(--fg3); font-size: 12px; }
.search-results .sr-snip { color: var(--fg2); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.search-results mark { background: transparent; color: var(--accent2); font-weight: 600; }
.live { color: var(--fg3); font-size: 12px; }
.live.on { color: var(--ok); animation: pulse 2.4s ease-in-out infinite; }
.live.off { color: var(--bad); }
.live.export { color: var(--info); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.icon-btn { background: transparent; border: 1px solid var(--line); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; color: var(--fg2); }
.icon-btn:hover { color: var(--fg); border-color: var(--fg3); }
.link-btn { background: none; border: 0; color: var(--accent2); cursor: pointer; padding: 0; font-size: 12px; }

.sidebar { grid-area: side; overflow: auto; background: var(--bg2); border-right: 1px solid var(--line); padding: 10px 0; }
.nav a { display: flex; justify-content: space-between; padding: 6px 16px; color: var(--fg2); }
.nav a:hover { color: var(--fg); text-decoration: none; background: var(--bg3); }
.nav a.active { color: var(--fg); background: var(--bg3); box-shadow: inset 3px 0 0 var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px 6px; border-top: 1px solid var(--line); margin-top: 8px; }
.filters select { flex: 1 1 100%; background: var(--bg); color: var(--fg2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 12px; }
.filters select.set { color: var(--fg); border-color: var(--accent); }
.tree-head { padding: 12px 16px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); }
.count { color: var(--fg3); font-size: 11px; font-weight: 400; }
.tree details { margin: 0; }
.tree summary { list-style: none; cursor: pointer; padding: 5px 16px; color: var(--fg); display: flex; align-items: center; gap: 6px; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary .tw { color: var(--fg3); font-size: 10px; width: 10px; transition: transform .15s; display: inline-block; }
.tree details[open] summary .tw { transform: rotate(90deg); }
.tree summary:hover { background: var(--bg3); }
.tree summary.active { background: var(--bg3); box-shadow: inset 3px 0 0 var(--accent); }
.tree summary .count { margin-left: auto; }
.tree .leaf { display: flex; align-items: center; gap: 8px; padding: 3px 16px 3px 32px; color: var(--fg2); font-size: 13px; }
.tree .leaf:hover { background: var(--bg3); color: var(--fg); text-decoration: none; }
.tree .leaf.active { color: var(--fg); background: var(--bg3); box-shadow: inset 3px 0 0 var(--accent); }
.tree .leaf.dim { opacity: .35; }
.tree .leaf span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; background: var(--muted); }
.dot.confirmed { background: var(--confirmed); } .dot.inferred { background: var(--inferred); } .dot.unknown { background: var(--unknown); }
.dot.superseded { opacity: .4; }

.main { grid-area: main; overflow: auto; padding: 24px 32px 60px; }
.details { grid-area: details; overflow: auto; display: flex; flex-direction: column; background: var(--bg2); border-left: 1px solid var(--line); padding: 16px; font-size: 13px; }
.statusbar { grid-area: status; display: flex; gap: 18px; align-items: center; padding: 0 14px; font-size: 11px; color: var(--fg3); background: var(--bg2); border-top: 1px solid var(--line); }
.statusbar a { color: var(--fg2); } .statusbar a:hover { color: var(--fg); }
.statusbar .outdated a { color: var(--accent2); background: linear-gradient(90deg, var(--accent2) 0%, #fff 45%, var(--accent2) 55%, var(--accent2) 100%); background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 2.8s linear infinite; cursor: help; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -40% 0; } }
@media (prefers-reduced-motion: reduce) { .statusbar .outdated a { animation: none; -webkit-text-fill-color: currentColor; background: none; color: var(--accent2); text-decoration: underline dotted; } }

h1 { font-size: 22px; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 17px; margin: 24px 0 10px; font-weight: 600; }
h3 { font-size: 13px; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); font-weight: 600; }
.sub { color: var(--fg2); margin: 0 0 18px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; line-height: 18px; background: var(--bg3); color: var(--fg2); border: 1px solid var(--line); white-space: nowrap; }
.pill.type { border-color: transparent; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent2); }
.pill.status-active { color: var(--active); border-color: var(--active); }
.pill.status-superseded { color: var(--superseded); text-decoration: line-through; }
.pill.status-open { color: var(--open); border-color: var(--open); }
.pill.status-needs-review { color: var(--needs-review); border-color: var(--needs-review); }
.pill.status-pending-confirmation { color: var(--pending-confirmation); border-color: var(--pending-confirmation); }
.pill.ev-confirmed { color: var(--confirmed); border-color: var(--confirmed); }
.pill.ev-inferred { color: var(--inferred); border-color: var(--inferred); }
.pill.ev-unknown { color: var(--unknown); border-color: var(--unknown); }
.pill.sev-error { color: var(--bad); border-color: var(--bad); }
.pill.sev-warning { color: var(--warn); border-color: var(--warn); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0 8px; }
.tile { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile .n { font-size: 26px; font-weight: 650; line-height: 1.1; }
.tile .l { color: var(--fg2); font-size: 12px; }
.tile.warn .n { color: var(--warn); } .tile.bad .n { color: var(--bad); } .tile.ok .n { color: var(--ok); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 1100px) { .grid2 { grid-template-columns: 1fr; } }
.card { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.bars { display: grid; grid-template-columns: minmax(0, max-content) 1fr max-content; gap: 6px 10px; align-items: center; }
.bars .k { color: var(--fg2); font-size: 12px; overflow-wrap: anywhere; }
.bars .v { font-size: 12px; color: var(--fg2); text-align: right; min-width: 24px; }
.bar { height: 10px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.bar i.confirmed, .bar i.ok { background: var(--confirmed); } .bar i.inferred { background: var(--inferred); } .bar i.unknown { background: var(--unknown); }
.bar i.active { background: var(--active); } .bar i.superseded { background: var(--superseded); } .bar i.open { background: var(--open); } .bar i.needs-review { background: var(--needs-review); } .bar i.pending-confirmation { background: var(--pending-confirmation); }
.stack { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--bg3); }
.stack i { display: block; height: 100%; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 12.5px; }
.kv .k { color: var(--fg3); }
.kv .v { color: var(--fg); word-break: break-word; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; color: var(--fg3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.t td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:hover td { background: var(--bg3); }
table.t tr.clickable { cursor: pointer; }

.topic-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.topic-card { display: block; color: var(--fg); background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.topic-card:hover { border-color: var(--accent); text-decoration: none; }
.topic-card .tt { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; }
.topic-card .td { color: var(--fg2); font-size: 12.5px; min-height: 36px; }
.topic-card .stack { margin-top: 10px; }
.topic-card .refs { color: var(--fg3); font-size: 11px; margin-top: 6px; }

.entry-list .row { display: block; color: var(--fg); padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg2); margin-bottom: 8px; }
.entry-list .row:hover { border-color: var(--accent); text-decoration: none; }
.entry-list .row .rt { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.entry-list .row .rs { color: var(--fg2); font-size: 12.5px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.entry-list .row .rm { color: var(--fg3); font-size: 11px; margin-top: 6px; }
.entry-list .row.dim { opacity: .4; }
/* search: the dropdown's footer link and the results page */
.search-results a.sr-all { color: var(--accent2); font-size: 12px; font-weight: 600; border-bottom: 0; }
.search-results .sr-missing { padding: 6px 12px; color: var(--fg3); font-size: 12px; border-bottom: 1px solid var(--line); }
.search-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.search-head h1 .q { color: var(--accent2); }
.search-page { max-width: 980px; }
.search-page .sgroup { margin: 0 0 22px; }
.search-page .sg-head { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; }
.search-page .sg-head .count { color: var(--fg3); font-size: 12px; }
.search-page .sgroup > .ms { margin: -4px 0 8px; font-size: 12px; }
.search-page mark { background: transparent; color: var(--accent2); font-weight: 600; }
.search-page .row .rs { -webkit-line-clamp: 3; }
.search-page .sgroup.missing .sr-missing { color: var(--fg2); font-size: 12.5px; padding: 3px 0; }

.reader { max-width: 820px; }
.reader .crumbs { color: var(--fg3); font-size: 12px; margin-bottom: 8px; }
.reader .crumbs a { color: var(--fg2); }
.reader h1 { font-size: 24px; line-height: 1.25; }
.reader .fields { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 22px; }
.reader .body p { margin: 0 0 12px; line-height: 1.65; font-size: 15px; }
.reader .body ul, .reader .body ol { margin: 0 0 12px 22px; line-height: 1.6; font-size: 15px; }
.reader .body pre { background: var(--bg3); padding: 12px; border-radius: 6px; overflow: auto; }
.reader .body pre code { background: transparent; padding: 0; }
.reader .body .label { display: block; margin: 16px 0 8px; padding: 10px 14px; border-left: 3px solid var(--line); background: var(--bg2); border-radius: 0 6px 6px 0; }
.reader .body .label > b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); margin-bottom: 4px; }
.reader .body .label.reason { border-left-color: var(--accent); }
.reader .body .label.rejected { border-left-color: var(--bad); }
.reader .body .label.consequence { border-left-color: var(--info); }
.reader .body .label.considered { border-left-color: var(--warn); }
.reader .body .label.why-open { border-left-color: var(--open); }
.reader .body .label p { margin: 0 0 6px; font-size: 14.5px; }
.reader .body .label p:last-child { margin: 0; }
.reader .pager { display: flex; justify-content: space-between; margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; }
.reader.superseded h1 { color: var(--fg2); }

.details h3:first-child { margin-top: 0; }
.details .fill { flex: 1; min-height: 0; }
.details .mini { position: relative; min-height: 220px; height: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); overflow: hidden; }
.details .mini canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; }
.details .mini.tall { height: 320px; flex: none; }
.details .mini .mini-hint { position: absolute; bottom: 6px; right: 8px; font-size: 10px; color: var(--fg3); pointer-events: none; }
.details .mini .mini-title { position: absolute; top: 6px; left: 8px; font-size: 10px; color: var(--fg3); text-transform: uppercase; letter-spacing: .06em; pointer-events: none; }
.details .legend-list { display: grid; gap: 6px; font-size: 12px; color: var(--fg2); }
.details .legend-list .dot { margin-right: 6px; vertical-align: middle; }
table.t.findings td { font-size: 12.5px; } table.t.findings .mono { white-space: nowrap; }
.details .empty { color: var(--fg3); }
.details .hist { list-style: none; padding: 0; margin: 0; border-left: 2px solid var(--line); margin-left: 6px; }
.details .hist li { padding: 2px 0 8px 12px; position: relative; color: var(--fg2); font-size: 12.5px; }
.details .hist li::before { content: ""; position: absolute; left: -6px; top: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.details .hist li.superseded::before { background: var(--superseded); }
.details .hist li.open::before { background: var(--open); }
.details .hist li .d { color: var(--fg3); font-size: 11px; }
.details .backlink { display: block; padding: 5px 8px; border-radius: 6px; color: var(--fg); background: var(--bg3); margin-bottom: 4px; font-size: 12.5px; }
.details .backlink:hover { text-decoration: none; background: var(--line); }
.details .finding { font-size: 12px; margin-bottom: 6px; color: var(--fg2); }

.graph-wrap { position: relative; height: calc(100vh - 48px - 24px - 48px); margin: -24px -32px -60px; }
.graph-wrap canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
.graph-wrap canvas.grabbing { cursor: grabbing; }
.graph-ui { position: absolute; top: 14px; left: 18px; display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--fg2); background: color-mix(in srgb, var(--bg2) 85%, transparent); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); }
.graph-ui label { display: flex; gap: 5px; align-items: center; cursor: pointer; }
.graph-legend { position: absolute; bottom: 14px; left: 18px; font-size: 11px; color: var(--fg2); display: flex; gap: 12px; background: color-mix(in srgb, var(--bg2) 85%, transparent); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); }
.graph-legend .dot { width: 9px; height: 9px; margin-right: 4px; vertical-align: middle; }
.graph-hint { position: absolute; top: 14px; right: 18px; font-size: 11px; color: var(--fg3); }

.timeline svg { width: 100%; height: 260px; display: block; }
.timeline .axis text { fill: var(--fg3); font-size: 10px; }
.timeline .axis line { stroke: var(--line); }
.timeline rect.b { cursor: pointer; }
.timeline rect.b:hover { opacity: .8; }
.timeline .sup { fill: var(--superseded); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 12px; color: var(--fg2); margin: 8px 0 16px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.queue h2 { display: flex; align-items: center; gap: 10px; }
.queue h2 .count { font-size: 13px; }
.queue .why { color: var(--fg2); font-size: 12.5px; margin: -6px 0 10px; }
.note { color: var(--fg3); font-size: 12px; }
.center { text-align: center; color: var(--fg3); padding: 60px 0; }
kbd { font-family: var(--mono); font-size: 11px; background: var(--bg3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.nav-toggle { display: none; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; color: var(--fg2); cursor: pointer; white-space: nowrap; margin-left: 4px; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.statusbar .grow { margin-left: auto; }

/* ---- phones and small tablets: one column, the sidebar becomes a nav row with a Topics drawer ---- */
@media (max-width: 900px) {
  /* nothing may be wider than the screen: grid items shrink below their content (min-width: 0), long tokens wrap, the document never scrolls sideways */
  html, body { max-width: 100vw; overflow-x: hidden; }
  .app { max-width: 100vw; }
  .app > * { min-width: 0; max-width: 100vw; }
  .main, .details, .sidebar, .strip, .topbar, .statusbar { overflow-wrap: anywhere; }
  code, .mono { overflow-wrap: anywhere; word-break: break-word; }
  pre, .reader .body pre { max-width: 100%; }
  .reader, .entry-list, .kv, .topic-cards, .card { max-width: 100%; }
  .kv { grid-template-columns: max-content minmax(0, 1fr); }
  .timeline svg { max-width: 100%; }
  .project-select { min-width: 0; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto 1fr auto auto; grid-template-areas: "top" "strip" "side" "main" "details" "status"; height: auto; min-height: 100vh; }
  .topbar { height: auto; min-height: 48px; flex-wrap: wrap; padding: 6px 10px; gap: 8px 10px; }
  .topbar .project { display: none; }
  .topbar-right { margin-left: auto; gap: 8px; }
  .project-select { max-width: 46vw; font-size: 13px; padding: 4px 6px; }
  .brand .wordmark { height: 24px; }
  #search { width: 150px; }
  .search-results { right: 0; width: min(92vw, 480px); max-height: 50vh; }
  .strip { height: auto; flex-wrap: wrap; padding: 6px 10px; gap: 6px; white-space: normal; overflow: visible; }
  .strip .sep { display: none; }
  .strip .lbl { flex-basis: 100%; margin-top: 2px; }
  .sidebar { padding: 0; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; position: sticky; top: 0; z-index: 5; }
  .nav { display: flex; align-items: center; overflow-x: auto; gap: 2px; padding: 6px 8px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { padding: 6px 10px; white-space: nowrap; border-radius: 999px; gap: 6px; }
  .nav a.active { box-shadow: none; background: var(--bg3); color: var(--fg); }
  .nav-toggle { display: inline-flex; flex: none; margin-left: auto; }
  .app.side-open .nav-toggle { color: var(--fg); border-color: var(--accent); }
  .filters, .tree-head, .tree { display: none; }
  .app.side-open .filters { display: flex; padding: 8px 10px 4px; border-top: 1px solid var(--line); margin-top: 0; }
  .app.side-open .filters select { flex: 1 1 30%; }
  .app.side-open .tree-head { display: block; }
  .app.side-open .tree { display: block; max-height: 55vh; overflow: auto; padding-bottom: 6px; }
  .main { padding: 16px 14px 32px; }
  .details { border-left: 0; border-top: 1px solid var(--line); padding: 14px; }
  .details .mini { min-height: 240px; height: 240px; }
  .details .mini.tall { height: 280px; }
  .graph-wrap { height: 72vh; margin: -16px -14px -32px; }
  .graph-ui { top: 10px; left: 10px; font-size: 11px; gap: 8px; padding: 5px 8px; }
  .graph-legend { left: 10px; right: 10px; bottom: 10px; flex-wrap: wrap; gap: 6px 10px; }
  .graph-hint { display: none; }
  .statusbar { height: auto; flex-wrap: wrap; padding: 6px 10px; gap: 4px 12px; line-height: 1.4; }
  .statusbar .grow { margin-left: 0; flex-basis: 100%; }
  .reader h1 { font-size: 20px; }
  .reader .body p, .reader .body ul, .reader .body ol { font-size: 14.5px; }
  .reader .pager { flex-wrap: wrap; gap: 8px; }
  .topic-cards { grid-template-columns: 1fr; }
  h1 { font-size: 20px; }
}
@media (max-width: 600px) {
  body { font-size: 15px; }
  .nav a, .nav-toggle { padding: 9px 12px; font-size: 14px; }
  .strip a.stat { font-size: 12px; padding: 3px 9px; line-height: 20px; }
  .strip .lbl { font-size: 11px; }
  .entry-list .row .rt { font-size: 15px; } .entry-list .row .rs { font-size: 13.5px; }
  .tree .leaf { padding: 7px 16px 7px 28px; font-size: 14px; }
  .tree summary { padding: 8px 16px; }
  .details { font-size: 14px; }
  .statusbar { font-size: 12px; }
  .filters select { font-size: 14px; padding: 7px 8px; }
  .topbar-right { flex: 1 1 100%; margin-left: 0; }
  #search { flex: 1; width: auto; min-width: 0; }
  .search-results { left: 0; right: 0; width: auto; }
  .project-select { max-width: calc(100vw - 150px); }
}
.sub.warn { color: var(--warn, #b7791f); }

/* family, projects, references (project families) */
.search-results .sr-missing { padding: 8px 12px; color: var(--fg3); font-size: 12px; border-bottom: 1px solid var(--line); }
.refs-box h3 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg3); }
.ref { padding: 4px 0; font-size: 13px; }
.ref b { margin-right: 6px; }
.note.warn { color: var(--warn); }
.family .member, .projects .prow { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 8px; }
.family .member.self, .projects .prow.here { border-color: var(--accent); }
.family .mr, .projects .pr { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
.family .role { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg3); min-width: 56px; }
.family .ms, .projects .pm { color: var(--fg2); font-size: 12.5px; margin-top: 4px; }
.family .mm { color: var(--fg3); font-size: 11px; margin-top: 4px; word-break: break-all; }
.family details.fetch { margin-top: 8px; font-size: 12.5px; }
.family details.fetch pre { background: var(--bg3); padding: 8px 10px; border-radius: 6px; overflow: auto; }
.pill.kind-repository { color: var(--ok); }
.pill.kind-cache { color: var(--info); }
.pill.kind-none { color: var(--fg3); }
.projects .prow.depth-1 { margin-left: 24px; } .projects .prow.depth-2 { margin-left: 48px; } .projects .prow.depth-3 { margin-left: 72px; }
.projects .tree-mark { color: var(--fg3); }
.projects .link-btn.danger { color: var(--bad); margin-top: 6px; }

/* local / public switch */
.mode { display: inline-flex; align-items: center; gap: 2px; border: 1px solid #3a3a43; border-radius: 6px; padding: 2px; flex: none; }
.mode[hidden] { display: none; }
.mode button { background: transparent; border: 0; color: #b4b4be; padding: 3px 9px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.mode button.on { background: var(--accent); color: #fff; }
.mode button:disabled { opacity: .4; cursor: not-allowed; }
.mode .note { color: #7a7a86; font-size: 11px; padding: 0 6px; }
.pill.kind-public { color: var(--accent2); }

/* the Family view as a tree */
.family .tree-row { display: flex; align-items: flex-start; gap: 6px; }
.family .tree-row > .member { flex: 1; min-width: 0; }
.family .tree-row .tree-mark { color: var(--fg3); padding-top: 12px; flex: none; }

/* the side-pane graph's near / project / family switch */
.details .mini .mini-seg { position: absolute; top: 6px; left: 6px; display: inline-flex; gap: 2px; background: color-mix(in srgb, var(--bg2) 85%, transparent); border: 1px solid var(--line); border-radius: 5px; padding: 1px; }
.details .mini .mini-seg button { background: transparent; border: 0; color: var(--fg3); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 6px; border-radius: 3px; cursor: pointer; }
.details .mini .mini-seg button.on { background: var(--accent); color: #fff; }
.details .mini .mini-seg .mini-title { position: static; padding: 1px 4px; }
.details .mini .mini-friends { left: auto; right: 6px; }
.details .mini .mini-friends button:disabled { cursor: progress; }

/* the family merged: a project heading in the sidebar, a banner on the overview, author links */
.tree .tree-project { padding: 10px 16px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent2); }
.family-banner { background: var(--bg2); border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px 12px; margin: 0 0 14px; font-size: 13px; }
.family-banner .note { color: var(--fg3); font-size: 11px; }
a.author { color: inherit; text-decoration: underline dotted; }
a.author:hover { color: var(--accent2); }

/* thoughts: chains of See and Superseded by, beside the graph */
.details .thought { margin: 2px 0; }
.details .thought-head { display: flex; align-items: baseline; gap: 6px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 4px 6px; color: var(--fg2); font: inherit; font-size: 12px; cursor: pointer; }
.details .thought-head:hover, .details .thought.on .thought-head { border-color: var(--line); background: var(--bg2); color: var(--fg); }
.details .thought-head .count { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; min-width: 1.2em; }
.details .thought-head .pill { margin-left: auto; }
.details .thought-steps { margin: 4px 0 8px 22px; padding: 0; font-size: 12px; }
.details .thought-steps li { margin: 2px 0; }
.details .thought-min { float: right; font-size: 10px; font-weight: 400; color: var(--fg3); text-transform: none; letter-spacing: 0; }
.details .thought-min button { background: transparent; border: 1px solid var(--line); color: var(--fg3); font-size: 10px; padding: 0 5px; margin-left: 2px; border-radius: 3px; cursor: pointer; }
.details .thought-min button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* the path: the projects walked through to get here */
.path-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; font-size: 12px; color: var(--fg2); padding: 6px 10px; margin: 0 0 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg2); }
.path-bar .label { color: var(--fg3); text-transform: uppercase; letter-spacing: .06em; font-size: 10px; margin-right: 4px; }
.path-bar .sep { color: var(--fg3); }
.path-bar .grow { flex: 1; }
.path-bar label { display: inline-flex; align-items: center; gap: 4px; color: var(--fg3); }
.graph-wrap .path-bar { position: absolute; top: 58px; left: 18px; margin: 0; max-width: calc(100% - 36px); background: color-mix(in srgb, var(--bg2) 85%, transparent); z-index: 1; }
@media (max-width: 900px) { .graph-wrap .path-bar { top: 50px; left: 10px; max-width: calc(100% - 20px); } }
.graph-ui .ui-group { display: inline-flex; gap: 10px; align-items: center; }
.graph-ui .ui-group + .ui-group { padding-left: 10px; border-left: 1px solid var(--line); }

/* a whole thought in one view */
.details .thought { position: relative; }
.details .thought .thought-head { padding-right: 52px; }
.details .thought-read { position: absolute; right: 6px; top: 5px; font-size: 11px; }
.thought-reader .thought-step { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px 6px; background: var(--bg2); }
.thought-reader .thought-step h2 { font-size: 18px; line-height: 1.3; margin: 4px 0 0; }
.thought-reader .thought-step h2 a { color: var(--fg); }
.thought-reader .thought-step .fields { margin: 10px 0 14px; }
.thought-reader .thought-step.superseded { opacity: .85; }
.thought-reader .thought-step.missing { background: transparent; border-style: dashed; }
.thought-reader .thought-link { color: var(--fg3); font-size: 12px; text-align: center; padding: 6px 0; letter-spacing: .04em; }
.details .thought.open .thought-head .count { color: var(--accent2); }
.details .thought-follow { display: block; font-size: 11px; margin: 0 0 4px 26px; text-align: left; }
.details .thought-follow-all { display: block; font-size: 12px; margin: 0 0 8px; }
.details .thought-open-head { margin-top: 16px; }
.thought-reader .thought-beyond { border: 1px dashed var(--line); border-radius: var(--radius); padding: 8px 12px; margin: 8px 0; font-size: 12px; color: var(--fg2); }

/* friends and thoughts pages */
.friends-page .friend-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg2); padding: 12px 18px; margin: 0 0 16px; }
.friends-page .friend-card h2 { font-size: 17px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.friends-page .friend-card h3 { font-size: 12px; margin: 14px 0 6px; }
.friends-page h2.section, .thoughts-page h2 { font-size: 16px; margin: 26px 0 8px; }
.thoughts-page .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 12px; }
.thoughts-page .stat { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg2); padding: 10px 14px; min-width: 110px; }
.thoughts-page .stat b { display: block; font-size: 22px; }
.thoughts-page .stat span { font-size: 12px; color: var(--fg3); }
.thoughts-page .thought-row { display: flex; align-items: baseline; gap: 8px; padding: 4px 6px; border-radius: 5px; font-size: 13px; }
.thoughts-page .thought-row:hover { background: var(--bg2); }
.thoughts-page .thought-row .count { color: var(--accent); font-weight: 600; min-width: 1.4em; font-variant-numeric: tabular-nums; }
.thoughts-page .fan { margin: 0 0 12px; }
.thoughts-page .fan-rows { margin-left: 18px; border-left: 2px solid var(--line); padding-left: 8px; }
.graph-ui .friends-ctl { display: inline-flex; gap: 10px; align-items: center; }

/* the side pane's width, chosen in the corner of its graph */
.details .pane-width { position: sticky; top: -16px; z-index: 2; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin: -16px -16px 12px; padding: 8px 16px; background: var(--bg2); border-bottom: 1px solid var(--line); font-size: 11px; color: var(--fg3); }
.details .pane-width .label { text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }
.details .pane-width .mini-width { display: inline-flex; gap: 2px; border: 1px solid var(--line); border-radius: 5px; padding: 1px; background: var(--bg2); }
.details .pane-width button { background: transparent; border: 0; color: var(--fg3); font-size: 11px; padding: 2px 7px; border-radius: 3px; cursor: pointer; }
.details .pane-width button.on { background: var(--accent); color: #fff; }
@media (max-width: 900px) { .details .pane-width { display: none; } }
@media (min-width: 901px) {
  .app[data-side="2"] { grid-template-columns: 280px minmax(0, 1fr) min(680px, 45vw); }
  .app[data-side="3"] { grid-template-columns: 280px minmax(0, 1fr) min(1020px, 60vw); }
  .app[data-side="half"] { grid-template-columns: 280px minmax(0, 1fr) minmax(0, 1fr); }
}

/* what a thought rests on, and how it grew */
.pill.warn-pill { border-color: var(--needs-review, #e0a83a); color: var(--needs-review, #e0a83a); }
.thought-reader .thought-warn { border-left: 3px solid var(--needs-review, #e0a83a); padding: 4px 10px; margin: 8px 0; font-size: 12.5px; color: var(--fg2); background: color-mix(in srgb, var(--needs-review, #e0a83a) 8%, transparent); }
.thought-reader .thought-affected { font-size: 12px; color: var(--fg3); margin: 6px 0; font-style: italic; }
.thought-reader .thought-timeline { margin: 10px 0 18px; }
.thought-reader .timeline-bar { position: relative; height: 22px; margin: 6px 12px 0; border-bottom: 2px solid var(--line); }
.thought-reader .timeline-bar .tick { position: absolute; bottom: -9px; transform: translateX(-50%); width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 9px; line-height: 16px; text-align: center; cursor: default; }
@media (max-width: 900px) { .graph-ui { flex-wrap: wrap; right: 10px; row-gap: 6px; } }
.details .mini .mini-open { position: absolute; bottom: 5px; right: 6px; background: color-mix(in srgb, var(--bg2) 85%, transparent); border: 1px solid var(--line); border-radius: 5px; color: var(--fg2); font-size: 10.5px; padding: 2px 7px; cursor: pointer; }
.details .mini .mini-open:hover { color: var(--fg); border-color: var(--accent); }
.details .mini .mini-hint { right: auto; left: 8px; }

y arrive on the wire,\nthe header and status fields are what user code actually inspects. Users of\nthe core API depend on both halves as they are, so the shape is a stable\ncompatibility constraint, not a tidy-up candidate.", "rejected": [], "consequence": "neither the core nor the `picows.websockets` wrapper\nnormalizes this away on its own. A wrapper that needs a uniform type converts\nat its own boundary (see `websockets-compat.md`) and leaves the core objects\nuntouched.", "considered": null, "why_open": null}, "refs": ["websockets-compat.md"], "git": {"created": {"author": "author-1", "date": "2026-09-11", "commit": "82ee159"}, "last_touched": {"author": "author-1", "date": "2026-09-30", "commit": "db0de39"}, "status_history": [{"status": "active", "author": "author-1", "date": "2026-09-11", "commit": "82ee159"}]}, "findings": []}, {"id": "core-api.md#send-side-calls-after-a-close-frame-are-no-ops", "uuid": "83fb4927-32e0-4f3b-b6a8-b3c0bfa55b04", "file": "core-api.md", "line": 26, "end_line": 47, "title": "Send-side calls after a CLOSE frame are no-ops", "type": ["constraint"], "status": "active", "evidence": "confirmed", "source": "maintainer-written agent instructions (`AGENTS.md`, until 2026-09), moved here; `WSTransport` in `picows/picows.pyx`", "verification": "corroborated — the send paths in `picows/picows.pyx` return early once `is_close_frame_sent` or `is_disconnected` is set", "revisit_when": "the shutdown sequence of `WSTransport` changes", "see": [], "superseded_by": null, "body": {"text": "Once a CLOSE frame has been sent, `send()`, `send_ping()`, `send_pong()` and\na second `send_close()` do nothing. `disconnect()` and `wait_disconnected()`\nare safe to call any number of times.\n\n**Reason:** shutdown is the one place where several parties race — the peer's\nclose, the user's close, an error on the socket. Making the send side\nidempotent in the core means every caller can just call it, instead of each\ncaller keeping its own \"did I already close?\" state.\n\n**Consequence:** wrapper code relies on these guarantees and adds no\nstate-based suppression of its own around shutdown.", "reason": "shutdown is the one place where several parties race — the peer's\nclose, the user's close, an error on the socket. Making the send side\nidempotent in the core means every caller can just call it, instead of each\ncaller keeping its own \"did I already close?\" state.", "rejected": [], "consequence": "wrapper code relies on these guarantees and adds no\nstate-based suppression of its own around shutdown.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "author-1", "date": "2026-09-11", "commit": "82ee159"}, "last_touched": {"author": "author-1", "date": "2026-09-30", "commit": "db0de39"}, "status_history": [{"status": "active", "author": "author-1", "date": "2026-09-11", "commit": "82ee159"}]}, "findings": []}, {"id": "core-api.md#max-frame-size-applies-to-non-control-frames-only", "uuid": "b56b37dd-a82f-487f-8349-e93a7846035f", "file": "core-api.md", "line": 48, "end_line": 66, "title": "`max_frame_size` applies to non-control frames only", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "`HISTORY.rst` 2.0.0 (\"Apply max_frame_size to non-control frames only\"); the frame parser in `picows/picows.pyx`", "verification": "corroborated — the parser checks control frames against 125 bytes and only data frames against `max_frame_size`; the changelog's \"127\" is the length-field boundary, the enforced payload limit is 125", "revisit_when": "the frame size limits are made configurable per frame type", "see": [], "superseded_by": null, "body": {"text": "Control frames (PING, PONG, CLOSE) are checked against the protocol's own\n125-byte payload limit (the frame parser rejects a control frame above it)\nand are not subject to the user-configured `max_frame_size`.\n\n**Reason:** the setting exists to bound memory for data frames (issue #37);\ncontrol frames are bounded by the protocol already. Applying the user limit\nto them would make a small `max_frame_size` reject legitimate control\ntraffic. The reason is inferred from the changelog wording and the code, not\nstated by the maintainer.", "reason": "the setting exists to bound memory for data frames (issue #37);\ncontrol frames are bounded by the protocol already. Applying the user limit\nto them would make a small `max_frame_size` reject legitimate control\ntraffic. The reason is inferred from the changelog wording and the code, not\nstated by the maintainer.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "author-1", "date": "2026-09-11", "commit": "82ee159"}, "last_touched": {"author": "author-1", "date": "2026-09-30", "commit": "db0de39"}, "status_history": [{"status": "active", "author": "author-1", "date": "2026-09-11", "commit": "82ee159"}]}, "findings": []}, {"id": "cython.md#no-typing-cast-in-cythonized-hot-paths", "uuid": "163ec5a7-64ca-4aca-bbe3-64f7ee7d12bc", "file": "cython.md", "line": 3, "end_line": 22, "title": "No `typing.cast(...)` in Cythonized hot paths", "type": ["constraint"], "status": "active", "evidence": "confirmed", "source": "maintainer-written agent instructions (`AGENTS.md`, until 2026-09), moved here", "verification": null, "revisit_when": "Cython starts erasing `typing.cast` at compile time", "see": [], "superseded_by": null, "body": {"text": "In modules that Cython compiles, `typing.cast(...)` may become a real global\nlookup plus a function call on every execution instead of being erased the\nway a type checker treats it.\n\n**Reason:** the hot paths are the whole point of picows; a construct that is\nfree in CPython and costs a call in Cython is a silent regression.\n\n**Rejected alternative:** casting for the type checker's benefit and accepting\nthe cost. Rejected — control-flow narrowing, assertions, or a narrowly scoped\n`type: ignore` give the checker what it needs without touching the compiled\ncode.", "reason": "the hot paths are the whole point of picows; a construct that is\nfree in CPython and costs a call in Cython is a silent regression.", "rejected": ["casting for the type checker's benefit and accepting\nthe cost. Rejected — control-flow narrowing, assertions, or a narrowly scoped\n`type: ignore` give the checker what it needs without touching the compiled\ncode."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "author-1", "date": "2026-09-11", "commit": "82ee159"}, "last_touched": {"author": "author-1", "date": "2026-09-30", "commit": "db0de39"}, "status_history": [{"status": "active", "author": "author-1", "date": "2026-09-11", "commit": "82ee159"}]}, "findings": []}, {"id": "event-loops.md#the-protocol-class-derives-from-a-dummy-cython-type-first-and-asyncio-bufferedprotocol-second", "uuid": "4aaa0f70-0611-4c01-aa0d-90580a89ba08", "file": "event-loops.md", "line": 3, "end_line": 26, "title": "The protocol class derives from a dummy Cython type first and `asyncio.BufferedProtocol` second", "type": ["workaround"], "status": "active", "evidence": "confirmed", "source": "maintainer comment above the protocol class in `picows/picows.pyx`", "verification": null, "revisit_when": "Cython allows a pure-Python first base for extension types, or uvloop and asyncio agree on how they detect a buffered protocol", "see": [], "superseded_by": null, "body": {"text": "uvloop and asyncio detect a `BufferedProtocol` differently: uvloop looks for a\n`get_buffer` attribute on a type that does not derive from `asyncio.Protocol`,\nasyncio requires actual inheritance from `asyncio.BufferedProtocol`. Cython\nextension types cannot take a pure-Python class as their first base.\n\n**Reason:** deriving from a dummy Cython type first and\n`asyncio.BufferedProtocol` second satisfies both loops with one class.\n\n**Consequence:** on Windows the default `ProactorEventLoop` does not\ngenuinely use the buffered protocol — it reads into its own buffer and copies\ninto the user's — so the zero-copy read path only pays off there with the\nselector loop. The recommendation to switch a Windows client to\n`WindowsSelectorEventLoopPolicy` lives in the same code comment; it is not\nyet in `docs/`.", "reason": "deriving from a dummy Cython type first and\n`asyncio.BufferedProtocol` second satisfies both loops with one class.", "rejected": [], "consequence": "on Windows the default `ProactorEventLoop` does not\ngenuinely use the buffered protocol — it reads into its own buffer and copies\ninto the user's — so the zero-copy read path only pays off there with the\nselector loop. The recommendation to switch a Windows client to\n`WindowsSelectorEventLoopPolicy` lives in the same code comment; it is not\nyet in `docs/`.", "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "author-1", "date": "2026-09-11", "commit": "82ee159"}, "last_touched": {"author": "author-1", "date": "2026-09-30", "commit": "db0de39"}, "status_history": [{"status": "active", "author": "author-1", "date": "2026-09-11", "commit": "82ee159"}]}, "findings": []}, {"id": "event-loops.md#buffered-protocol-instead-of-data-received", "uuid": "c55efb4d-d6c0-4110-b68e-56b8307f53aa", "file": "event-loops.md", "line": 27, "end_line": 43, "title": "Buffered protocol instead of `data_received`", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "pull request #69 (\"Enable buffered protocol as it is more memory efficient and faster\")", "verification": null, "revisit_when": "a supported event loop stops implementing `BufferedProtocol`", "see": [{"locator": "event-loops.md#the-protocol-class-derives-from-a-dummy-cython-type-first-and-asynciobufferedprotocol-second", "uuid": "4aaa0f70-0611-4c01-aa0d-90580a89ba08", "date": "2026-09-30", "file": "event-loops.md", "anchor": "the-protocol-class-derives-from-a-dummy-cython-type-first-and-asynciobufferedprotocol-second", "remote": null}], "superseded_by": null, "body": {"text": "The read path uses `asyncio.BufferedProtocol` (`get_buffer` /\n`buffer_updated`) rather than the plain `data_received` callback.\n\n**Reason:** the loop reads straight into picows' own buffer, which removes one\ncopy per read and the allocation of an intermediate `bytes` object. The\nchange was made for memory and speed; the workaround above is the price.", "reason": "the loop reads straight into picows' own buffer, which removes one\ncopy per read and the allocation of an intermediate `bytes` object. The\nchange was made for memory and speed; the workaround above is the price.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "author-1", "date": "2026-09-11", "commit": "82ee159"}, "last_touched": {"author": "author-1", "date": "2026-09-30", "commit": "db0de39"}, "status_history": [{"status": "active", "author": "author-1", "date": "2026-09-11", "commit": "82ee159"}]}, "findings": []}, {"id": "event-loops.md#reads-from-the-socket-can-be-capped-per-call-max-read-size", "uuid": "0dfae98e-3584-46ed-86cc-d5207eb3f66b", "file": "event-loops.md", "line": 44, "end_line": 84, "title": "Reads from the socket can be capped per call (`max_read_size`)", "type": ["decision"], "status": "open", "evidence": "confirmed", "source": "issue #117, pull request #118 (measurements in its description); the unicorn-binance-websocket-api replay benchmark that surfaced it", "verification": null, "revisit_when": "#118 is merged (record the chosen default here) or rejected", "see": [{"locator": "https://github.com/oliver-zehentleitner/unicorn-binance-websocket-api", "uuid": "b8a65cf6-d48b-42dd-8924-e5682ba6f947", "date": "2026-09-30", "file": null, "anchor": null, "remote": "https://github.com/oliver-zehentleitner/unicorn-binance-websocket-api"}, {"locator": "https://github.com/oliver-zehentleitner/unicorn-binance-websocket-api", "uuid": "2be4c0ef-a914-4ae8-880c-6e2c56473864", "date": "2026-09-30", "file": null, "anchor": null, "remote": "https://github.com/oliver-zehentleitner/unicorn-binance-websocket-api"}], "superseded_by": null, "body": {"text": "`get_buffer()` hands the transport the whole free part of the read buffer.\nWhen the peer is faster than the consumer, the kernel receive buffer holds\nmegabytes and one read pulls all of it in; the buffer doubles to fit and\nnever shrinks, and the frames are then copied out and decoded after their\nbytes have left the CPU cache. On 450 KB frames from a loopback firehose\nthis made picows slower per message than the pure-Python `websockets`\nlibrary, whose asyncio transport reads 256 KB at a time (strace: 79 reads\nof ~3.4 MB versus 1,060 reads of 256 KB for the same 600 messages).\n\n**Decision proposed in #118:** a `max_read_size` argument on `ws_connect()`\nand `ws_create_server()`, applied in `get_buffer()` as an upper bound on\nthe bytes offered per read, default `0` = unchanged. With 256 KB the same\nscenario went from 3,780 to 8,381 msgs/s (297 to 146 µs CPU per message);\nthe echo case with a fast consumer does not change.\n\n**Rejected alternative:** a larger `read_buffer_init_size`. A 4 MiB\ninitial buffer measured the same as the 16 KB default (313 vs. 229 µs\nagainst websockets), so the doubling is not where the time goes; it\nhappens a few times per connection, the per-byte cost is in every read.\n\n**Open:** whether the default should be a cap in the range of the asyncio\ntransport's 256 KB instead of `0`; that is the maintainer's call and is\nasked in #118.\n\nThe consumer-side half of the same finding lives in the project that\nsurfaced it: its stream loop scanned every payload in full for endpoint\nmarkers, which is what made the consumer slower than the wire; that scan is\nnow confined to the message head (first `See` line: the benchmark and its\nreading, second: that fix).", "reason": null, "rejected": ["a larger `read_buffer_init_size`. A 4 MiB\ninitial buffer measured the same as the 16 KB default (313 vs. 229 µs\nagainst websockets), so the doubling is not where the time goes; it\nhappens a few times per connection, the per-byte cost is in every read."], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "author-1", "date": "2026-09-21", "commit": "26f797e"}, "last_touched": {"author": "author-1", "date": "2026-09-30", "commit": "db0de39"}, "status_history": [{"status": "open", "author": "author-1", "date": "2026-09-21", "commit": "26f797e"}]}, "findings": []}, {"id": "event-loops.md#aiofastnet-is-an-optional-dependency-and-the-write-path-trusts-its-copy-guarantee", "uuid": "36e0f3f5-8050-45de-ae0e-20ce5d14684a", "file": "event-loops.md", "line": 85, "end_line": 102, "title": "`aiofastnet` is an optional dependency, and the write path trusts its copy guarantee", "type": ["decision"], "status": "active", "evidence": "confirmed", "source": "`README.md` (aiofastnet bullet); maintainer comment in the write path of `picows/picows.pyx`; pull request #89", "verification": null, "revisit_when": "aiofastnet changes its write semantics, or the transport gains another fast path", "see": [], "superseded_by": null, "body": {"text": "`aiofastnet` is not required; when it provides the transport, picows hands\nthe write path a non-owning memoryview into its own buffer instead of\nbuilding a `bytes` object.\n\n**Reason:** aiofastnet guarantees that data it cannot send immediately is\ncopied, so the view can point at memory picows will reuse. The stock asyncio\ntransport makes no such promise, which is why that branch still allocates.\nKeeping the dependency optional lets picows run on any loop; the fast path is\na bonus where the guarantee holds.", "reason": "aiofastnet guarantees that data it cannot send immediately is\ncopied, so the view can point at memory picows will reuse. The stock asyncio\ntransport makes no such promise, which is why that branch still allocates.\nKeeping the dependency optional lets picows run on any loop; the fast path is\na bonus where the guarantee holds.", "rejected": [], "consequence": null, "considered": null, "why_open": null}, "refs": [], "git": {"created": {"author": "author-1", "date": "2026-09-11", "commit": "82ee159"}, "last_touched": {"author": "author-1", "date": "2026-09-30", "commit": "db0de39"}, "status_history": [{"status": "active", "author": "author-1", "date": "2026-09-11", "commit": "82ee159"}]}, "findings": []}, {"id": "masking.md#one-c-translation-unit-per-simd-instruction-set", "uuid": "f650fbb9-7be2-4b24-9aa1-6f3a21192606", "file": "masking.md", "line": 3, "end_line": 27, "title": "One C translation unit per SIMD instruction set", "type": ["decision"], "status": "active", "evidence": "inferred", "source": "pull request #96 (\"make separate translation unit for each architecture\"); `_get_mask_compile_units()` and the per-file compile flags in `setup.py`", "verification": null, "revisit_when": "the build moves to a system that supports per-function target attributes portably, or a new instruction set is added", "see": [], "superseded_by": null, "body": {"text": "The masking kernels live in `mask_sse2.c`, `mask_avx2.c`, `mask_avx512.c`\nand `mask_neon.c`, one file each, with `mask_dispatch.c` picking a kernel at\nruntime from the CPU's reported features (`__builtin_cpu_supports` on\ngcc/clang, `__cpuidex` on MSVC).\n`setup.py` attaches the matching `-m<isa>` flag per file.\n\n**Reason:** a compiler will only emit AVX-512 code for a unit compiled with\nthe AVX-512 flag, and compiling the whole extension that way would make the\nbinary crash on older CPUs. Separate units let each kernel be compiled for\nexactly its target while the dispatcher and everything else stay baseline.\nThe reason is inferred from the build layout; the maintainer has not stated\nit in writing.\n\n**Rejected alternative:** a single masking file with function-level target\nattributes. Not portable across the compilers /* Keep the Why dashboard — the pure part of the page: no DOM, no fetch,

   node:test (tests/web/lib.test.mjs). */

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

// Raw-file URL of a repository file at HEAD, per host — the second and last
// place host grammar lives (the first is hostFileLink below). Public mode
// reads one file this way: a family member's .keep-the-why, for its
// dashboard-state line.
function rawFileUrl(canonical, root, path) {
  const base = canonical.replace(/\/$/, "");
  const rel = `${root ? root.replace(/\/$/, "") + "/" : ""}${path}`;
  const gh = base.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)$/);
  if (gh) return `https://raw.githubusercontent.com/${gh[1]}/${gh[2]}/HEAD/${rel}`;
  if (/^https:\/\/gitlab\./.test(base)) return `${base}/-/raw/HEAD/${rel}`;
  if (/^https:\/\/bitbucket\.org/.test(base)) return `${base}/raw/HEAD/${rel}`;

// A state document from anywhere: whatever this page did not produce may be
// older or newer than it — unknown keys are ignored, missing ones blank.

  s.project = s.project && typeof s.project === "object" ? s.project : {};

}

// repository as its host renders it. Everything else in Keep the Why keeps
// canonical + file + anchor apart and never bakes a host into a field.

  if (/^https:\/\/gitlab\./.test(base) || /\/-\//.test(base)) seg = `/-/blob/${ref}/`;
  else if (/^https:\/\/(codeberg\.org|gitea\.|forgejo\.)/.test(base)) seg = `/src/branch/${ref}/`;

const canonicalOf = (p) => p?.canonical || (p?.git?.remote ? `https://${p.git.remote}` : "");

function parseSupersededBy(value) {
  if (!value) return null;

// A Type value as a name: `undefined — <reason>` is counted and shown as
// `undefined`; the reason stays on the entry (the pill's tooltip, the details pane).
const typeName = (t) => String(t ?? "").split(/\s+[—–-]\s+/)[0].trim();

const kindLabel = (k) => k === "cache" ? "cache, read only" : k === "repository" ? "repository, read and write" : k === "public" ? "published export" : "not available here";

// Families in a project list: every row with its depth, a parent first and

}

// entry: its title, body, Revisit when, Source, Id, file, type, status or
// evidence. The hit says how strong it is (terms in the title, occurrences in
// total) and where the snippet comes from: the first field after the title
// that carries a term, or the title when no other field does.

function searchHit(e, query) {

    ["id", e.uuid || ""], ["file", e.file || ""], ["type", (e.type || []).join(" ")], ["status", e.status || ""], ["evidence", e.evidence || ""]]
    .map(([name, text]) => ({ name, text, low: text.toLowerCase() }));

  for (const f of [...fields.slice(1), fields[0]]) {

// A family location as the published side reads it: an https URL is another
// repository (its own root), a relative path is a directory in the same
// repository, resolved against the root the location was read from.
function resolveLocation(location, canonical, root = "") {
  if (!location) return null;
  if (/^https:\/\//.test(location)) return { canonical: location.replace(/\/+$/, ""), root: "" };
  if (!canonical) return null;
  const parts = [];
  for (const seg of `${root}/${location}`.split("/")) {
    if (!seg || seg === ".") continue;
    if (seg === "..") { if (!parts.length) return null; parts.pop(); } else parts.push(seg);

  return { canonical, root: parts.join("/") };
}

// Friends: the repositories that `entries` cite by a cross-project See or

// family). One row per repository with the Ids cited there, sorted by
// canonical. Derived from the entries alone — nothing is fetched here.
function friendsOf(entries, exclude = []) {
  const norm = (c) => String(c || "").replace(/\/+$/, "").toLowerCase();
  const skip = new Set(exclude.filter(Boolean).map(norm));
  const out = new Map();
  const add = (canonical, uuid) => {
    if (!canonical || !uuid || skip.has(norm(canonical))) return;
    const k = norm(canonical);
    if (!out.has(k)) out.set(k, { canonical: String(canonical).replace(/\/+$/, ""), uuids: [] });

    if (SHAKY.includes(e?.status)) shaky.push({ i, why: e.status });

}

  if (LIVE_ES) { LIVE_ES.close(); LIVE_ES = null; }
  if (window.__KTW_STATE__ && MODE === "export") { dot.className = "live export"; dot.title = "static export — no live updates"; return; }
  if (!LIVE()) { dot.className = "live export"; dot.title = "public export — no live updates"; return; }
  let es;
  const open = () => {
    es = LIVE_ES = new EventSource(api("/api/events"));
    es.addEventListener("state", (ev) => { try { applyState(normalizeState(JSON.parse(ev.data))); dot.className = "live on"; dot.title = `live — last update ${new Date().toLocaleTimeString()}`; } catch (err) { console.error(err); } });
    es.onopen = () => { dot.className = "live on"; dot.title = "live — watching the project for changes"; };
    es.onerror = () => { dot.className = "live off"; dot.title = "connection lost — the server is gone; retrying"; };
  };
  open();
}
// The side pane's width: 1×, 2× (the default), 3×, or half the page beside
// the text — kept per browser, ignored on a narrow screen. Two widths: one
// where the pane is the graph (the overview, the Friends and Thoughts pages,
// the reader), one where it holds something else (an entry's or a topic's
// details, the graph view's legend).
const SIDE_WIDTHS = ["1", "2", "3", "half"];
const readSide = (key, fallback = "2") => { try { const v = localStorage.getItem(key); return SIDE_WIDTHS.includes(v) ? v : fallback; } catch { return fallback; } };
const SIDE = { graph: readSide("ktw-side-graph", readSide("ktw-side")), other: readSide("ktw-side-other") };
const paneKind = () => ($("#details")?.dataset.pane === "graph" ? "graph" : "other");
const sideLabel = (v) => (v === "half" ? "½" : `${v}×`);
function applySide() {
  const v = SIDE[paneKind()];
  $("#app").dataset.side = v;
  const d = $("#details");
  if (d && !d.querySelector(":scope > .pane-width")) d.prepend(paneWidthBar());
  for (const b of document.querySelectorAll(".mini-width button")) b.classList.toggle("on", b.textContent === sideLabel(v));
  for (const G of ACTIVE_GRAPHS) G.wake?.();
}
function setSide(v) { const k = paneKind(); SIDE[k] = v; try { localStorage.setItem(`ktw-side-${k}`, v); } catch {} applySide(); }
// the choice sits at the top of the pane, above whatever it holds, on every page
function paneWidthBar() {
  return el("div", { class: "pane-width", title: "the width of this pane: 1×, 2×, 3×, or half the page — one width where the pane is the graph, one where it holds details" },
    el("span", { class: "label" }, "Width"),
    el("span", { class: "mini-width" }, ...SIDE_WIDTHS.map((v) => el("button", { type: "button", class: v === SIDE[paneKind()] ? "on" : "", onclick: () => setSide(v) }, sideLabel(v)))));
}
function setupSideToggle() {
  const btn = $("#side-toggle"); const app = $("#app");
  btn.onclick = () => { const open = app.classList.toggle("side-open"); btn.setAttribute("aria-expanded", String(open)); btn.textContent = open ? "Topics ▴" : "Topics ▾"; };
  window.addEventListener("hashchange", () => { if (narrow() && app.classList.contains("side-open")) btn.click(); });
}
function setupTheme() {
  const saved = localStorage.getItem("ktw-theme");
  const prefersLight = window.matchMedia?.("(prefers-color-scheme: light)").matches;
  if (saved === "light" || (!saved && prefersLight)) document.documentElement.dataset.theme = "light";
  $("#theme").onclick = () => { const light = document.documentElement.dataset.theme === "light"; if (light) delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = "light"; localStorage.setItem("ktw-theme", light ? "dark" : "light"); if (graph) { graph.alpha = Math.max(graph.alpha, 0.05); graph.wake?.(); } };
}
function fitSelect(sel) {
  // size the select to its current option's text, not the browser's default width
  const opt = sel.selectedOptions[0]; if (!opt) return;
  const probe = el("span", { style: "position:absolute;visibility:hidden;white-space:nowrap;font:inherit" }, opt.textContent);
  sel.parentElement.append(probe); const w = probe.getBoundingClientRect().width; probe.remove();
  if (w) sel.style.width = `${Math.ceil(w) + 44}px`;
}
async function setupProjects() {
  if (window.__KTW_STATE__) return;
  let data;
  try { data = await (await fetch("/api/projects", { cache: "no-store" })).json(); } catch { return; }
  const sel = $("#project-select");
  const list = data.projects || [];
  if (list.filter((p) => p.path).length < 2 && !list.some((p) => !p.path)) return;
  const current = PROJECT || data.selected;
  PROJECTS = list;
  const opt = (p, indent = "") => el("option", { value: p.key, selected: p.key === current, disabled: !p.path, title: p.path || "location unknown — start the dashboard in that project once, or pass --scan" },
    p.path ? `${indent}${p.name}  (${p.kind === "cache" ? "cache, read only" : "repository"})${p.source === "cwd" ? "  · here" : ""}` : `${p.id}  (location unknown)`);
  // families grouped: a parent, its children indented below it (children found by canonical or path)
  const flat = groupByFamily(list);
  const groups = [["Projects", flat.filter(([p]) => p.path)], ["Known, location unknown", flat.filter(([p]) => !p.path)]];
  sel.replaceChildren(...groups.filter(([, items]) => items.length).map(([label, items]) => el("optgroup", { label }, items.map(([p, d]) => opt(p, "\u00a0\u00a0".repeat(d) + (d ? "└ " : ""))))));
  sel.hidden = false;
  fitSelect(sel);
  if (S) { const t = $("#project-title").querySelector("b"); if (t) t.remove(); }
  sel.onchange = () => { location.href = `${location.pathname}?project=${encodeURIComponent(sel.value)}${location.hash || "#overview"}`; };
  SELECTED_DEFAULT = data.selected;
}
function setupMode() {
  const box = $("#mode"); const p = S.project;
  const canonical = canonicalOf(p);
  // two sources exist only on the live server: this machine's clones, or the
  // published exports. A static page has one — it is published — so no switch
  const hasFamily = !!(p.parent || (p.children || []).length || p.dashboard_state);
  if (STATIC || (!hasFamily && MODE !== "public")) { box.hidden = true; return; }
  box.hidden = false;
  for (const b of box.querySelectorAll("button")) {
    const on = b.dataset.mode === (MODE === "public" ? "public" : "local");
    b.classList.toggle("on", on);
    b.disabled = b.dataset.mode === "public" && !canonical;
    b.title = b.dataset.mode === "public" ? (canonical ? "read this project's family from its published exports" : "no canonical — cannot be looked up publicly") : "read clones and caches on this machine";
    b.onclick = () => {
      if (on) return;
      if (b.dataset.mode === "public") location.href = publicHref(canonical, p.root || "", location.hash || "#overview");
      else location.href = `${location.pathname}${location.hash || "#overview"}`;
    };
  }
  $("#mode-note").textContent = MODE === "public" ? `generated ${S.generated}` : "";
}
async function boot() {
  setupTheme(); setupSearch(); setupScope(); setupSideToggle();
  window.addEventListener("hashchange", () => { RESTORE_SCROLL = 0; render(); });
  window.addEventListener("popstate", onPopState);
  document.addEventListener("click", onLinkClick);
  if (MODE === "public") {
    const r = await fetchPublicState(PUBLIC, PUBLIC_ROOT);
    const dot = $("#live"); dot.className = "live export"; dot.title = "public export — no live updates";
    if (!r.state) {
      const msg = el("div", { class: "center" }, el("p", {}, `Cannot browse ${PUBLIC} publicly: ${r.error}.`));
      $("#main").append(msg);
      if (r.missingLine) {
        // the live server may know a local checkout that already carries the line, on a branch the default branch has not merged
        try {
          const local = ((await (await fetch("/api/projects", { cache: "no-store" })).json()).projects || []).find((p) => p.canonical === PUBLIC && p.dashboard_state);
          if (local) msg.append(el("p", { class: "note" }, `Your checkout at ${local.path} names ${local.dashboard_state} — on a branch that is not on the default branch yet. Public mode reads what is published: the line counts once it is merged, and the family once the published export carries it.`));
        } catch { /* not served by a live dashboard */ }
      }
      msg.append(el("p", {}, el("a", { href: location.pathname }, "back to local")));
      return;
    }
    r.state.exported = true;
    applyState(r.state);
    return;
  }
  setupProjects();
  if (window.__KTW_STATE__) applyState(normalizeState(window.__KTW_STATE__));
  else {
    try { applyState(normalizeState(await (await fetch(api("/api/state.json"), { cache: "no-store" })).json())); }
    catch (err) { $("#main").append(el("p", { class: "center" }, PROJECT ? `No state for project "${PROJECT}" — unknown id or unknown location.` : "Could not load the state — is the server running?")); }
  }
  connectLive();
  pollUpdates(); setTimeout(pollUpdates, 20000); // the server's first check may still be running at boot
  setInterval(pollUpdates, 60 * 60 * 1000);
}
boot();
