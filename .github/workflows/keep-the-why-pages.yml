name: keep-the-why-pages

# Fork-only: publishes this fork's Keep the Why dashboard export to GitHub
# Pages so that projects citing this fork can load it as a friend. Not part
# of the upstream pull request (tarasko/picows#111) — this branch exists for
# testing the dashboard's friend resolution against a fork.

on:
  push:
    branches: [keep-the-why-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the dashboard dates entries by the commit their heading first appeared in
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Export the Keep the Why dashboard into site/keep-the-why-dashboard
        run: |
          python3 -m pip install --quiet "keep-the-why-dashboard>=0.4.2"
          mkdir -p site
          ktw-dashboard --export site/keep-the-why-dashboard .
          test -s site/keep-the-why-dashboard/index.html
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=keep-the-why-dashboard/">' > site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
